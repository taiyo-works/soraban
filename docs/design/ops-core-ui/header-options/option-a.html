<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ヘッダー案 A（余白）</title>
<link rel="stylesheet" href="base.css">
<style>
/* A 余白：ワードマークと、左から右へ上がる 1 本の航跡（墨 2px）。右端に小さなドローンと橙の丸。 */
.hd { height: 112px; }
.in { padding-top: 16px; }
.trail { left: 0; right: 0; bottom: 0; height: 40px; }
.trail .line { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.drone { position: absolute; right: 14px; bottom: 22px; width: 52px; color: var(--ink); z-index: 3; }
.drone svg { display: block; width: 100%; height: auto; }
.sun { position: absolute; right: 26px; top: 16px; width: 26px; height: 26px; border-radius: 50%; background: var(--orange); z-index: 1; }
@media (min-width: 1024px) {
  .hd { height: 200px; }
  .in { padding-top: 40px; }
  .trail { height: 76px; }
  .drone { right: max(32px, calc((100% - 1120px) / 2 + 32px)); bottom: 46px; width: 84px; }
  .sun { right: max(40px, calc((100% - 1120px) / 2 + 40px)); top: 36px; bottom: auto; width: 44px; height: 44px; }
}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="drone" viewBox="0 0 160 96"><g fill="none" stroke="currentColor" style="stroke-width:var(--sw,3)" stroke-linecap="round" stroke-linejoin="round"><rect x="62" y="38" width="36" height="18" rx="9"/><circle cx="80" cy="47" r="4.5"/><path d="M64 42 L36 28 M96 42 L124 28 M64 52 L36 66 M96 52 L124 66"/><ellipse cx="30" cy="24" rx="22" ry="4.5"/><ellipse cx="130" cy="24" rx="22" ry="4.5"/><ellipse cx="30" cy="70" rx="22" ry="4.5"/><ellipse cx="130" cy="70" rx="22" ry="4.5"/><path d="M30 24 V28 M130 24 V28 M30 66 V70 M130 66 V70 M70 58 V68 M90 58 V68 M64 68 H76 M84 68 H96"/></g></symbol></defs></svg>
<header class="hd" aria-label="そらばん">
  <div class="in"><h1><span class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 160 96"><use href="#drone"/></svg></span> そらばん</span><span class="sub" style="display:block">ドローンの飛行計画の通報・点検・飛行日誌</span></h1></div>
  <div class="art trail m"><svg viewBox="0 0 375 40" preserveAspectRatio="none"><path class="line" d="M0 36 C130 36 250 34 375 22"/></svg></div>

</header>
<div class="intro"><p class="lead"><strong>業務でドローンを飛ばす事業者・操縦者のための道具です。</strong>このページは、地点がどの法令・条例に当たるかを出典つきで確かめる判定のページです（判定は補助）。</p><p class="note">通報の記録・点検・飛行日誌は、運航管理の画面で扱います（社内で試験運用中）。</p></div><div class="sec"><h2>地点を判定する</h2></div>
