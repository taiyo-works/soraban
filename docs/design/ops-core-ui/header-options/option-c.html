<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ヘッダー案 C（経路）</title>
<link rel="stylesheet" href="base.css">
<style>
/* C 経路：地図の格子（薄い灰）の帯の上を、橙の太い経路線が離陸点から着陸点へ。経由点は墨の輪。 */
.hd { height: 128px; }
.in { padding-top: 14px; }
.map { left: 0; right: 0; bottom: 0; height: 40px; background: var(--surface); border-top: 1.5px solid var(--ink); }
.map .g { stroke: #DAD8CE; stroke-width: 1; vector-effect: non-scaling-stroke; }
.map .route { fill: none; stroke: var(--orange); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.map .wp { fill: #fff; stroke: var(--ink); stroke-width: 2.5; vector-effect: non-scaling-stroke; }
.map .end { fill: var(--ink); }
@media (min-width: 1024px) {
  .hd { height: 240px; }
  .in { padding-top: 40px; }
  .map { height: 84px; }
}
</style></head><body>

<div class="intro"><p class="lead"><strong>業務でドローンを飛ばす事業者・操縦者のための道具です。</strong>このページは、地点がどの法令・条例に当たるかを出典つきで確かめる判定のページです（判定は補助）。</p><p class="note">通報の記録・点検・飛行日誌は、運航管理の画面で扱います（社内で試験運用中）。</p></div><div class="sec"><h2>地点を判定する</h2></div>
