<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ヘッダー案 B（幾何）</title>
<link rel="stylesheet" href="base.css">
<style>
/* B 幾何：橙の円（日）を中心に、等高線を抽象した同心円（薄い灰の線）。円の 1 本にドローンが乗る。円と直線だけ。 */
.hd { height: 128px; }
.in { padding-top: 14px; }
.geo { inset: 0; }
.geo .ring { fill: none; stroke: #D9D7CD; stroke-width: 1.5; }
.geo .sun { fill: var(--orange); }
.geo .axis { stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
.drone { position: absolute; z-index: 3; width: 44px; color: var(--ink); }
.drone svg { display: block; width: 100%; height: auto; }
@media (min-width: 1024px) {
  .hd { height: 240px; }
  .in { padding-top: 40px; }
}
</style></head><body>

  <span class="drone m" style="left:212px;top:31px" aria-hidden="true"><svg viewBox="0 0 160 96"><use href="#drone"/></svg></span>

  <div class="in"><h1><span class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 160 96"><use href="#drone"/></svg></span> そらばん</span><span class="sub" style="display:block">ドローンの飛行計画の通報・点検・飛行日誌</span></h1></div>
</header>
<div class="intro"><p class="lead"><strong>業務でドローンを飛ばす事業者・操縦者のための道具です。</strong>このページは、地点がどの法令・条例に当たるかを出典つきで確かめる判定のページです（判定は補助）。</p><p class="note">通報の記録・点検・飛行日誌は、運航管理の画面で扱います（社内で試験運用中）。</p></div><div class="sec"><h2>地点を判定する</h2></div>
