# Soraban Supabase ローカル開発設定（Phase 1 着手準備）。
# Supabase CLI のデフォルトに最小限の調整のみ。実際の起動は Phase 1 中盤以降。

project_id = "soraban"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[db.migrations]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = false

[auth]
enabled = false

[edge_runtime]
enabled = true
