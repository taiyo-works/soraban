name: Fetch regulation data

# 地図データ（DID 令和2年・工業専用地域）を国土数値情報から取得し、同梱形式に変換する（手動実行のみ）。
# ダウンロード URL はダウンロードページの HTML から抜き出す（推測しない）。取得できない入手元はスキップしてログに残す。
# 処理本体：packages/regulations/scripts/fetch-regulation-data.sh

on:
  workflow_dispatch:
    inputs:
      output:
        description: "生成物の扱い（artifact＝成果物として保存／commit＝実行したブランチにコミットして push）"
        type: choice
        options: [artifact, commit]
        default: artifact
      prefs:
        description: "都道府県コード（空白区切り）"
        type: string
        default: "31 32"
      include_industrial:
        description: "工業専用地域（国土数値情報 用途地域 A29）も取得する"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: fetch-regulation-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install GDAL (Shapefile → GeoJSON)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin unzip
      - run: pnpm install --frozen-lockfile

      - name: Fetch and convert
        env:
          WORK_DIR: ${{ runner.temp }}/regulation-data
        run: |
          args=(--prefs "${{ inputs.prefs }}")
          if [[ "${{ inputs.include_industrial }}" != "true" ]]; then args+=(--skip-industrial); fi
          bash packages/regulations/scripts/fetch-regulation-data.sh "${args[@]}"
          cat "$WORK_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Show changes and sizes
        run: |
          git status --short
          du -sh packages/regulations/data/did/r2 packages/regulations/data/industrial-exclusive/by-muni 2>/dev/null || true

      # 生成データで判定・型・テストが壊れていないことを確かめる（失敗したらコミット・成果物化しない）
      - run: pnpm typecheck
      - run: pnpm test

      # 生成物は常に成果物として残す（commit を選んだ場合は次のジョブがこれを取り込んでコミットする）
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: regulation-data
          retention-days: 14
          if-no-files-found: warn
          path: |
            packages/regulations/data/did/r2/
            packages/regulations/data/industrial-exclusive/
            packages/regulations/data/sources.json
            packages/regulations/src/data-bundle/
      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: regulation-data-summary
          retention-days: 14
          path: ${{ runner.temp }}/regulation-data/summary.md

  commit:
    if: inputs.output == 'commit'
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # このジョブだけがブランチへ push する
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: regulation-data
          path: packages/regulations
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/regulations/data/did/r2 packages/regulations/data/industrial-exclusive packages/regulations/data/sources.json packages/regulations/src/data-bundle
          if git diff --cached --quiet; then
            echo "変更なし（コミットしない）"
            exit 0
          fi
          git commit -m "data(regulations): 国土数値情報から DID・工業専用地域を取得して同梱（fetch-regulation-data）"
          git push origin "HEAD:${GITHUB_REF_NAME}"
