name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
        env:
          CI: "1"
          E2E_SERVER_CMD: pnpm --filter @soraban/web exec next start -p 3100
          # DID・工業専用地域をテスト用フィクスチャに差し替えたサーバー（同じビルドを使う）
          E2E_FIXTURE_SERVER_CMD: NEXT_DIST_DIR=.next pnpm --filter @soraban/web exec next start -p 3101
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Sprint 9: 外部サービス（国土地理院）との疎通確認。E2E は模擬サーバーを使うため、実サービスの変化はここで見る。
  # 外部の都合で落ちうるので、失敗しても CI 全体は止めない。
  smoke-external:
    name: smoke (external services, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: smoke
        continue-on-error: true
        run: node scripts/smoke-external.mjs | tee "$RUNNER_TEMP/smoke.log"; exit "${PIPESTATUS[0]}"
      - if: steps.smoke.outcome == 'failure'
        run: |
          while IFS= read -r line; do echo "::warning title=外部サービスの疎通確認::$line"; done < "$RUNNER_TEMP/smoke.log"

  # Sprint 8: DB を使うテスト。PostgreSQL 18 + PostGIS 3.6 のサービスコンテナだけを使う。
  # Neon の接続文字列・API キー・Neon Auth の URL・秘密は参照しない（GitHub に秘密情報を置かない）。
  # Sprint 10: アプリ用ロール soraban_app を作ってからマイグレーションを適用し、test:db と運航管理の E2E-DB
  # （AUTH_PROVIDER=test・OPS_ENABLED=1・soraban_app で接続した next start）を実行する。
  db:
    name: db (PostGIS service container)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # 管理用（テストが使い捨てのデータベースを作る）。
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # TEST_DATABASE_URL が無いときにスキップで緑にしない。
      REQUIRE_DB_TESTS: "1"
      EXPECT_PG_MAJOR: "18"
      # マイグレーション・テスト用の初期データの投入（オーナーロール）。
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/soraban_ci
      # E2E-DB のアプリの接続先（soraban_app。サービスコンテナ内だけの使い捨てのパスワード）。
      E2E_OPS_DATABASE_URL: postgresql://soraban_app:soraban_app_ci_only@localhost:5432/soraban_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: create app role soraban_app（マイグレーションより先に作る）
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "create role soraban_app with login password 'soraban_app_ci_only'"
      - name: create migration target database
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "create database soraban_ci"
      - name: pnpm db:migrate（空の DB に全マイグレーションを適用）
        run: pnpm db:migrate
      - name: pnpm db:migrate（2 回目は何もしない）
        run: |
          out=$(pnpm db:migrate)
          echo "$out"
          echo "$out" | grep -q "未適用のマイグレーションはありません"
          expected=$(ls packages/db/migrations/*.sql | wc -l)
          test "$(psql "$DATABASE_URL_UNPOOLED" -tAc 'select count(*) from schema_migrations')" = "$expected"
      - name: pnpm db:status
        run: pnpm db:status
      - name: soraban_app の権限（運航管理の表は参照と record_versions への追加だけ）
        run: |
          test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', 'record_versions', 'INSERT')")" = "t"
          test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', 'record_versions', 'UPDATE')")" = "f"
          test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', 'aircraft', 'INSERT')")" = "f"
          test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', 'members', 'SELECT')")" = "t"
      # Sprint 12a：判定スナップショット・運航管理者の確認は追記専用（参照と追加だけ）。飛行計画・よく使う地点はヘッド表（参照だけ）。
      - name: soraban_app の権限（判定スナップショット・確認は追加だけ。飛行計画・よく使う地点は参照だけ）
        run: |
          for t in judgement_snapshots plan_confirmations; do
            test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', '$t', 'SELECT')")" = "t"
            test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', '$t', 'INSERT')")" = "t"
            test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', '$t', 'UPDATE')")" = "f"
            test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', '$t', 'DELETE')")" = "f"
            test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', '$t', 'TRUNCATE')")" = "f"
          done
          for t in flight_plans saved_places; do
            test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', '$t', 'SELECT')")" = "t"
            test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', '$t', 'INSERT')")" = "f"
            test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', '$t', 'UPDATE')")" = "f"
            test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', '$t', 'DELETE')")" = "f"
            test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', '$t', 'TRUNCATE')")" = "f"
          done
          test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_function_privilege('soraban_app', 'verify_judgement_snapshots(uuid)', 'EXECUTE')")" = "f"
      # Sprint 12b：通報の試行・監査と手続きの「済み」の記録は追加だけ（追記専用）。通報の記録はヘッド表（参照だけ。書くのは record_versions への追加→トリガー）。
      - name: soraban_app の権限（通報の試行・手続きの記録は追加だけ。通報の記録は参照だけ）
        run: |
          for t in flight_report_attempts plan_procedure_records; do
            test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', '$t', 'SELECT')")" = "t"
            test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', '$t', 'INSERT')")" = "t"
            test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', '$t', 'UPDATE')")" = "f"
            test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', '$t', 'DELETE')")" = "f"
            test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', '$t', 'TRUNCATE')")" = "f"
          done
          test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', 'flight_reports', 'SELECT')")" = "t"
          for p in INSERT UPDATE DELETE TRUNCATE; do
            test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', 'flight_reports', '$p')")" = "f"
          done
          test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_function_privilege('soraban_app', 'flight_report_effective_id(uuid)', 'EXECUTE')")" = "f"
      # Sprint 12c：現場の事実の記録（離陸・着陸・確認・取り消す・日誌との結び付き）は追加だけ（追記専用）。
      - name: soraban_app の権限（現場の事実の記録は追加だけ）
        run: |
          test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', 'flight_field_events', 'SELECT')")" = "t"
          test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', 'flight_field_events', 'INSERT')")" = "t"
          test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', 'flight_field_events', 'UPDATE')")" = "f"
          test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', 'flight_field_events', 'DELETE')")" = "f"
          test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', 'flight_field_events', 'TRUNCATE')")" = "f"
      # Sprint 12d：許可・承認の登録はヘッド表（参照だけ。書くのは record_versions への追加→トリガー）。判定スナップショットの根拠の検査は新規のトリガー。
      - name: soraban_app の権限（許可・承認の登録は参照だけ）
        run: |
          test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', 'permit_registrations', 'SELECT')")" = "t"
          test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', 'permit_registrations', 'INSERT')")" = "f"
          test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', 'permit_registrations', 'UPDATE')")" = "f"
          test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', 'permit_registrations', 'DELETE')")" = "f"
          test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', 'permit_registrations', 'TRUNCATE')")" = "f"
          test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select count(*) from pg_trigger where tgname = 'judgement_snapshots_permit_basis' and tgrelid = 'judgement_snapshots'::regclass")" = "1"
      # Sprint 12e：事故・ヒヤリハットの記録はヘッド表（参照だけ。書くのは record_versions への追加→トリガー）。国への報告の記録は追加だけ（追記専用）。
      - name: soraban_app の権限（事故・ヒヤリハットの記録は参照だけ。報告の記録は追加だけ）
        run: |
          test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', 'incident_records', 'SELECT')")" = "t"
          test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', 'incident_records', 'INSERT')")" = "f"
          test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', 'incident_records', 'UPDATE')")" = "f"
          test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', 'incident_records', 'DELETE')")" = "f"
          test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', 'incident_records', 'TRUNCATE')")" = "f"
          test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', 'incident_report_records', 'SELECT')")" = "t"
          test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', 'incident_report_records', 'INSERT')")" = "t"
          test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', 'incident_report_records', 'UPDATE')")" = "f"
          test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', 'incident_report_records', 'DELETE')")" = "f"
          test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_table_privilege('soraban_app', 'incident_report_records', 'TRUNCATE')")" = "f"
          test "$(psql "$DATABASE_URL_UNPOOLED" -tAc "select has_function_privilege('soraban_app', 'verify_incident_report_records(uuid)', 'EXECUTE')")" = "f"
      - name: REQUIRE_DB_TESTS=1 で TEST_DATABASE_URL が無いと失敗することを確認
        run: |
          if env -u TEST_DATABASE_URL pnpm test:db; then
            echo "TEST_DATABASE_URL なしで test:db が成功してしまった（スキップで緑になっている）" >&2
            exit 1
          fi
      - run: pnpm build
      - run: pnpm test:db
      - name: test:db が DB サーバーに痕跡（使い捨て DB）を残さず、先に作った soraban_app を消していないことを確認
        run: |
          test "$(psql "$TEST_DATABASE_URL" -tAc "select count(*) from pg_roles where rolname = 'soraban_app'")" = "1"
          test "$(psql "$TEST_DATABASE_URL" -tAc "select count(*) from pg_database where datname like 'soraban_t_%'")" = "0"
      - name: テスト用の初期データ（運航管理。localhost だけに投入できる）
        run: pnpm db:seed:ops-test
      - run: pnpm exec playwright install --with-deps chromium
      - name: E2E-DB（運航管理。AUTH_PROVIDER=test・OPS_ENABLED=1・soraban_app で接続した next start）
        run: pnpm test:e2e:ops
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-ops
          path: |
            playwright-report-ops/
            test-results/
          retention-days: 7
